<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Section — Isolation Test</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --white:        #ffffff;
    --paper:        #f7f7f5;
    --ink:          #1b1b1d;
    --ink-soft:     #4a4a4e;
    --muted:        #6e6e73;
    --line:         #ece9e4;
    --fox:          #ff5e2e;
    --fox-dark:     #e04a1c;
    --fox-tint:     #fff1ea;
    --shadow-sm:    0 2px 8px rgba(20,20,22,0.05);
    --shadow-md:    0 12px 32px rgba(20,20,22,0.07);
    --radius-sm:    12px;
    --radius-md:    18px;
    --radius-lg:    28px;
  }
  *{box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;margin:0;}

  #contact-me{
    padding:100px 0;
    background:
      radial-gradient(700px 340px at 50% 0%, var(--fox-tint), transparent 70%),
      var(--white);
  }
  #contact-me .wrap{ max-width:1000px; margin:0 auto; padding:0 24px; }
  #contact-me .section-head{ margin-bottom:44px; text-align:center; }
  #contact-me .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:13px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;
    color:var(--fox-dark);margin-bottom:14px;justify-content:center;
  }
  #contact-me .section-title{ font-size:clamp(30px,4vw,42px); margin-bottom:10px; font-weight:800; }
  #contact-me .section-sub{ max-width:440px; margin:0 auto; color:var(--muted); }

  .contact-nav-row{
    display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin-bottom:48px;
  }
  .btn-nav{
    display:inline-flex; align-items:center; gap:8px; padding:12px 24px;
    border-radius:999px; font-size:14px; font-weight:600; text-decoration:none;
    transition:transform .2s ease, box-shadow .2s ease, background .2s ease, color .2s ease;
  }
  .btn-nav svg{ width:15px; height:15px; }
  .btn-nav-back{ background:var(--white); color:var(--ink-soft); border:1px solid var(--line); }
  .btn-nav-back:hover{ border-color:var(--fox); color:var(--fox-dark); transform:translateY(-2px); box-shadow:var(--shadow-sm); }
  .btn-nav-personal{ background:var(--ink); color:var(--white); box-shadow:var(--shadow-sm); }
  .btn-nav-personal:hover{ background:var(--fox-dark); transform:translateY(-2px); box-shadow:var(--shadow-md); }

  .contact-card{
    border:1px solid var(--line); border-radius:var(--radius-lg); background:var(--white);
    box-shadow:var(--shadow-md); padding:44px; max-width:900px; margin:0 auto;
  }
  .contact-card legend{
    font-size:12.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--fox-dark); padding:0 12px;
  }

  .contact-flex{
    display:grid; grid-template-columns:1.2fr 1fr; gap:52px; align-items:start;
  }
  @media(max-width:720px){
    .contact-flex{ grid-template-columns:1fr; gap:36px; }
    .contact-card{ padding:32px 24px; }
  }

  .contact-form-side form{ display:flex; flex-direction:column; gap:20px; }
  .contact-form-side label{
    display:flex; flex-direction:column; gap:8px; font-size:13px; font-weight:600; color:var(--ink-soft);
  }
  .contact-form-side input[type="text"],
  .contact-form-side input[type="email"],
  .contact-form-side textarea{
    font-family:'Inter',sans-serif; font-size:15px; color:var(--ink); background:var(--paper);
    border:1px solid var(--line); border-radius:var(--radius-sm); padding:13px 15px; resize:vertical;
    transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .contact-form-side textarea{ background:var(--fox-tint); border-color:#ffe1d1; }
  .contact-form-side input:focus, .contact-form-side textarea:focus{
    outline:none; border-color:var(--fox); background:var(--white); box-shadow:0 0 0 4px var(--fox-tint);
  }
  .contact-submit{
    align-self:flex-start; background:var(--fox); color:var(--white); border:none; padding:14px 30px;
    border-radius:999px; font-size:15px; font-weight:600; box-shadow:var(--shadow-sm);
    transition:transform .2s ease, box-shadow .2s ease, background .2s ease; cursor:pointer;
  }
  .contact-submit:hover{ background:var(--fox-dark); transform:translateY(-2px); box-shadow:var(--shadow-md); }

  .contact-links-side{ display:flex; flex-direction:column; justify-content:center; }
  .contact-link-list{ display:flex; flex-direction:column; gap:18px; list-style:none; margin:0; padding:0; }
  .contact-link-list li{ display:flex; align-items:center; gap:14px; }
  .contact-link-list a{ font-size:14.5px; font-weight:600; color:var(--ink-soft); text-decoration:none; transition:color .2s ease; }
  .contact-link-list a:hover{ color:var(--fox-dark); }
  .contact-icon-wrap{
    width:44px; height:44px; flex-shrink:0; border-radius:var(--radius-sm); background:var(--fox-tint);
    display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-sm);
    transition:transform .2s ease, box-shadow .2s ease; font-size:18px;
  }
  .contact-link-list li:hover .contact-icon-wrap{ transform:translateY(-2px); box-shadow:var(--shadow-md); }
</style>
</head>
<body>

<section id="contact-me">
  <div class="wrap">

    <div class="contact-nav-row">
      <a href="#" class="btn-nav btn-nav-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        Back to Website
      </a>
      <a href="#" target="_blank" class="btn-nav btn-nav-personal">
        My Personal Site
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 17L17 7M7 7h10v10"/></svg>
      </a>
    </div>

    <div class="section-head">
      <span class="eyebrow">Say hello</span>
      <h1 class="section-title">Contact Me</h1>
      <p class="section-sub">Have a question, a project idea, or just want to connect? Reach out below.</p>
    </div>

    <fieldset class="contact-card">
      <legend>Get in Touch</legend>

      <div class="contact-flex">
        <div class="contact-form-side">
          <form>
            <label>Name<input type="text" required></label>
            <label>Email<input type="email" required></label>
            <label>Message<textarea rows="6" required></textarea></label>
            <input type="submit" value="Send Message" class="contact-submit">
          </form>
        </div>

        <!-- RIGHT SIDE: no external images, so image-load failures can't hide it -->
        <div class="contact-links-side">
          <ul class="contact-link-list">
            <li><span class="contact-icon-wrap"> <img src="Images/LinkedInIcon.png" alt="Linkedin" width="50" height="50"></span><a href="https://www.linkedin.com/in/cameron-fox-296965319/">My LinkedIn</a></li>
            <li><span class="contact-icon-wrap"><img src="Images/GitHubIcon.png" alt="Github" width="50" height="50"></span><a href="https://github.com/CameronFox01">My GitHub</a></li>
            <li><span class="contact-icon-wrap"><img src="Images/EmailIcon.png" alt="Github" width="50" height="50"></span><a href="cameron22401@icloud.com">cameron22401@icloud.com</a></li>
            <li><span class="contact-icon-wrap"><img src="Images/InstagramIcon.png" alt="Instagram" width="50" height="50"></span></span><a href="https://www.instagram.com/the_coding_fox/">@the_coding_fox</a></li>
          </ul>
        </div>
      </div>
    </fieldset>
  </div>
</section>

</body>
</html>
